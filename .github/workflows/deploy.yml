name: Desplegar Mercat Asistent en GitHub Pages

on:
  # Se ejecuta automáticamente al hacer push en la rama main
  push:
    branches:
      - main
  # Permite lanzar el despliegue de forma manual desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos requeridos para que GitHub Pages pueda publicar el contenido generado
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente para evitar conflictos
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Prepara el entorno Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instala dependencias y compila el proyecto con Vite
      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto (Vite Build)
        run: npm run build

      # 4. Configura y sube el artefacto para GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de compilación (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 5. Despliegue en la infraestructura de GitHub Pages
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
